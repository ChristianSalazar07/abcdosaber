{% extends "base_template.html" %}

{% block title %}
    <title>ABC do Saber - Cadastro Alunos</title>
{% endblock %}

{% block menu %} 
    <div class="collapse navbar-collapse justify-content-end" id="mynavbar">
        <div class="navbar-nav">
            <a href="{% url 'index' %}" class="nav-link">Início</a>
            <a href="{% url 'cadastrar_aluno' %}" class="nav-link active">Cadastrar</a>
            <a href="{% url 'listar_aluno' %}" class="nav-link">Listar</a>
        </div>
    </div>
{% endblock %}

                        <a href="#" class="close" data-dismiss="alert" aria-label="close">&times;</a>

{% block titulo_pagina %}
    <div class="container text-center border-bottom border-primary bg-dark text-light">    
        <div class="row mt-5">
            <div class="col">
                <h1>Cadastro de Alunos</h1>
            </div>  
        </div>
    </div>
{% endblock %}

{% block corpo %}
    <form action="#" method="POST" name="frmCadastrarAluno" id="idFrmCadastrarAluno">
        <div class="form-group">
            <label for='idNome'>Nome</label>
            <input class="form-control bg-dark text-light" type='text' id='idNome' name='nome' placeholder='Informe o nome do aluno' required>
        </div>
        <div class="form-group">
            <label for='idDataInicial'>Data de Início na Escola</label>
            <input class="form-control bg-dark text-light" type='date' id='idDataInicial' name='dataInicial' required>
        </div>
        <div class='form-group text-center'>
            <input type='reset'  value='Limpar' class='btn btn-primary btn-md'>
            <input type='submit' value='Cadastrar' class='btn btn-primary btn-md' id="btnCadastrarTiposAtividade">
        </div>
    </form>
{% endblock %}
