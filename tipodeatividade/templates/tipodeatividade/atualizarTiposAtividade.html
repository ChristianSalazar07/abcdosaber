{% extends "base_template.html" %}

{% block title %}
    <title>ABC do Saber - Atualizar Tipos de Atividade</title>
{% endblock %}

{% block menu %}
    <div class="collapse navbar-collapse justify-content-end" id="mynavbar">
        <div class="navbar-nav">
            <a href="/" class="nav-link">Início</a>
            <a href="{% url 'tipodeatividade:cadastrar' %}" class="nav-link">Cadastrar</a>
            <a href="{% url 'tipodeatividade:listar' %}" class="nav-link active">Listar</a>
        </div>
    </div>
{% endblock %}


    <!--         
        <div class="row">
                <div class="col">
                    <div class="alert alert-success alert-dismissible" role="alert">
                        <a href="#" class="close" data-dismiss="alert" aria-label="close">&times;</a>
                    </div>
                </div>
        </div> 
    -->
{% block titulo_pagina %}
    <div class="container text-center border-bottom border-primary bg-dark text-light">    
        <div class="row mt-5">
            <div class="col">
                <h1>Atualizar Tipos de Atividade</h1>
            </div>  
        </div>
    </div>
{% endblock %}
    

{% block corpo %}
    <form action="{% url 'tipodeatividade:atualizar' codigo %}" method="POST" name="frmAtualizarTiposAtividade" id="idFrmAtualizarTiposAtividade">
    {% csrf_token %}
        <div class="row">
            <div class="form-group col-10">
                <label for='idDescricao'>Descrição anterior</label>
                <input class="form-control bg-dark text-light" type='text' id='idDescricao' value='{{ atividadeAlterada.descricao }}' name='descricaoAnterior' readonly required>
            </div>
            <div class="form-group col-2">
                <label for='idDescricao'>Código</label>
                <input class="form-control bg-dark text-light" type='text' id='idDescricao' value='{{ codigo }}' name='codigo' readonly required>
            </div>
            <div class="form-group col-12">
                <label for='idDescricao'>Descrição</label>
                <input class="form-control bg-dark text-light" type='text' id='idDescricao' name='descricao' placeholder='Informe a descrição' required>
            </div>
            <div class='form-group text-center col-12'>
                <input type='reset'  value='Limpar' class='btn btn-primary btn-md'>
                <input type='submit' value='Cadastrar' class='btn btn-primary btn-md' id="btnAtualizarTiposAtividade">
            </div>
        </div>
    </form>
{% endblock %}
