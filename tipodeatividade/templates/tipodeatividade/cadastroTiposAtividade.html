{% extends "base_template.html" %}

{% block title %}
    <title>ABC do Saber - Cadastro Tipos de Atividade</title>
{% endblock %}

{% block menu %}
    <div class="collapse navbar-collapse justify-content-end" id="mynavbar">
        <div class="navbar-nav">
            <a href="/" class="nav-link">Início</a>
            <a href="{% url 'tipodeatividade:cadastrar' %}" class="nav-link active">Cadastrar</a>
            <a href="{% url 'tipodeatividade:listar' %}" class="nav-link">Listar</a>
        </div>
    </div>
{% endblock %}

                        <a href="#" class="close" data-dismiss="alert" aria-label="close">&times;</a>

{% block titulo_pagina %}
    <div class="container text-center border-bottom border-primary bg-dark text-light">    
        <div class="row mt-5">
            <div class="col">
                <h1>Cadastro de Tipos de Atividade</h1>
            </div>  
        </div>
    </div>
{% endblock %}
    

{% block corpo %}
    <form action="{% url 'tipodeatividade:cadastrar' %}" method="POST" name="frmCadastrarTiposAtividade" id="idFrmCadastrarTiposAtividade">
    {% csrf_token %}
        <div class="form-group">
            <label for='idDescricao'>Descrição</label>
            <input class="form-control bg-dark text-light" type='text' id='idDescricao' name='descricao' placeholder='Informe a descrição' required>
        </div>
        <div class='form-group text-center'>
            <input type='reset'  value='Limpar' class='btn btn-primary btn-md'>
            <input type='submit' value='Cadastrar' class='btn btn-primary btn-md' id="btnCadastrarTiposAtividade">
        </div>
    </form>
{% endblock %}
